  <script>
    const pageUrls = [
      "index.html",
      "figures.html",
      "tools.html",
      "resources.html",
      "about.html"
    ];

    const form = document.getElementById("search-form");
    const input = document.getElementById("search-input");
    const status = document.getElementById("search-status");
    const results = document.getElementById("search-results");
    const fallbackPages = JSON.parse(document.getElementById("search-fallback").textContent);
    let pagesPromise = null;

    function loadPages() {
      if (location.protocol === "file:") {
        return Promise.resolve(fallbackPages);
      }

      if (!pagesPromise) {
        pagesPromise = Promise.all(pageUrls.map(async (url) => {
          const response = await fetch(url);
          if (!response.ok) {
            throw new Error(`Could not load ${url}`);
          }

          const html = await response.text();
          const parsed = new DOMParser().parseFromString(html, "text/html");
          const main = parsed.querySelector("main");

          return {
            title: parsed.querySelector("title").textContent.split(" |")[0],
            url,
            text: (main ? main.textContent : "").replace(/\s+/g, " ").trim()
          };
        })).catch(() => {
          pagesPromise = null;
          return fallbackPages;
        });
      }

      return pagesPromise;
    }

    function renderResults(matches, term) {
      results.replaceChildren();

      if (!term) {
        status.textContent = "Enter a term to search the site.";
        return;
      }

      if (!matches.length) {
        status.textContent = `No results found for “${term}”.`;
        return;
      }

      status.textContent = `${matches.length} result${matches.length === 1 ? "" : "s"} found.`;

      matches.forEach((page) => {
        const item = document.createElement("li");
        const link = document.createElement("a");
        const snippet = document.createElement("p");
        const matchIndex = page.text.toLowerCase().indexOf(term.toLowerCase());
        const start = Math.max(0, matchIndex - 70);
        const end = Math.min(page.text.length, matchIndex + term.length + 110);

        link.href = page.url;
        link.textContent = page.title;
        snippet.textContent = `${start > 0 ? "…" : ""}${page.text.slice(start, end)}${end < page.text.length ? "…" : ""}`;
        snippet.className = "search-result-snippet";
        item.append(link, snippet);
        results.append(item);
      });
    }

    async function search(term) {
      if (!term) {
        renderResults([], term);
        return;
      }

      status.textContent = "Searching…";
      try {
        const loadedPages = await loadPages();
        const normalizedTerm = term.toLowerCase();
        const matches = loadedPages.filter((page) => page.text.toLowerCase().includes(normalizedTerm));
        renderResults(matches, term);
      } catch (error) {
        status.textContent = "Search is temporarily unavailable. Please try again.";
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const term = input.value.trim();
      const query = term ? `?q=${encodeURIComponent(term)}` : "";
      window.history.replaceState({}, "", `search.html${query}`);
      search(term);
    });

    const initialTerm = new URLSearchParams(window.location.search).get("q") || "";
    input.value = initialTerm;
    if (initialTerm) {
      search(initialTerm);
    }
  </script>
