<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Search the EAMxx atmospheric river demo.">
  <title>Search | EAMxx Atmospheric Rivers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="search-page">
  <header class="site-header">
    <div class="header-inner">
      <a class="site-title" href="index.html">Energy Exascale Earth System Model</a>
      <div class="site-nav-wrap">
        <nav aria-label="Main navigation">
          <ul class="site-nav">
            <li><a href="index.html">Home</a></li>
            <li><a href="figures.html">Figures</a></li>
            <li><a href="tools.html">Movies</a></li>
            <li><a href="resources.html">Resources</a></li>
          </ul>
        </nav>
        <a class="search-link" href="search.html" aria-label="Search" aria-current="page">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.7" fill="none" stroke="currentColor" stroke-width="2.2"></circle>
            <path d="M16 16l5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <main>
    <section class="page-heading">
      <h1>Search</h1>
      <div class="title-rule" aria-hidden="true"></div>
    </section>

    <section class="search-content">
      <form class="search-form" id="search-form" role="search">
        <label class="visually-hidden" for="search-input">Search this site</label>
        <input id="search-input" name="q" type="search" placeholder="Search this site" autocomplete="off">
        <button type="submit">Search</button>
      </form>
      <p class="search-status" id="search-status" aria-live="polite">Enter a term to search the site.</p>
      <ul class="search-results" id="search-results"></ul>
    </section>
  </main>
  <footer class="site-footer">
    <p>EAMxx atmospheric river analysis.</p>
  </footer>

  <script>
    const pageUrls = [
      "index.html",
      "figures.html",
      "tools.html",
      "resources.html",
      "about.html"
    ];

    const form = document.getElementById("search-form");
    const input = document.getElementById("search-input");
    const status = document.getElementById("search-status");
    const results = document.getElementById("search-results");

    const pages = Promise.all(pageUrls.map(async (url) => {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`Could not load ${url}`);
      }

      const html = await response.text();
      const document = new DOMParser().parseFromString(html, "text/html");
      const main = document.querySelector("main");

      return {
        title: document.querySelector("title").textContent.split(" |")[0],
        url,
        text: (main ? main.textContent : "").replace(/\s+/g, " ").trim()
      };
    }));

    function renderResults(matches, term) {
      results.replaceChildren();

      if (!term) {
        status.textContent = "Enter a term to search the site.";
        return;
      }

      if (!matches.length) {
        status.textContent = `No results found for “${term}”.`;
        return;
      }

      status.textContent = `${matches.length} result${matches.length === 1 ? "" : "s"} found.`;

      matches.forEach((page) => {
        const item = document.createElement("li");
        const link = document.createElement("a");
        const snippet = document.createElement("p");
        const matchIndex = page.text.toLowerCase().indexOf(term.toLowerCase());
        const start = Math.max(0, matchIndex - 70);
        const end = Math.min(page.text.length, matchIndex + term.length + 110);

        link.href = page.url;
        link.textContent = page.title;
        snippet.textContent = `${start > 0 ? "…" : ""}${page.text.slice(start, end)}${end < page.text.length ? "…" : ""}`;
        snippet.className = "search-result-snippet";
        item.append(link, snippet);
        results.append(item);
      });
    }

    async function search(term) {
      if (!term) {
        renderResults([], term);
        return;
      }

      status.textContent = "Searching…";
      try {
        const loadedPages = await pages;
        const normalizedTerm = term.toLowerCase();
        const matches = loadedPages.filter((page) => page.text.toLowerCase().includes(normalizedTerm));
        renderResults(matches, term);
      } catch (error) {
        status.textContent = "Search is temporarily unavailable. Please try again.";
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const term = input.value.trim();
      const query = term ? `?q=${encodeURIComponent(term)}` : "";
      window.history.replaceState({}, "", `search.html${query}`);
      search(term);
    });

    const initialTerm = new URLSearchParams(window.location.search).get("q") || "";
    input.value = initialTerm;
    if (initialTerm) {
      search(initialTerm);
    }
  </script>
</body>
</html>
